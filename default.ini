#########################################
## Settings for Atelier Arland Fix
##
## Place beside the game executable, next to d3d11.dll. Every value here is the
## default, so deleting the file (or any single line) changes nothing. Close the
## game before editing.
##
## Upgrading: this file ships with each release but contains only defaults, so
## keep the one you already customised rather than overwriting it.
##
## Full documentation: ADVANCED.md
#########################################

[Rendering]
# The size of the window or display. Leave blank to use your desktop
# resolution, which is what you almost certainly want. Set DisplayWidth=game to
# keep whatever the game's own settings launcher selected instead. Never set
# this above your monitor's resolution -- presenting more pixels than the screen
# has just scales them away again. To render higher than the screen, raise
# RenderWidth/RenderHeight below.
DisplayWidth=
DisplayHeight=

# Run as an undecorated window filling the monitor instead of taking exclusive
# control of the display. Alt-tabs instantly and behaves better with compositors
# and multi-monitor setups. When on, the game's own FullScreen setting in
# ArlandDX_Settings.ini is ignored -- leave it at whatever it is. Set this to
# false if you specifically want exclusive fullscreen.
Borderless=true

# The resolution the game actually renders at, before being scaled down to the
# display size above. Setting this higher than the display size is
# supersampling: it sharpens everything, scene and UI alike, and is the most
# expensive option in this file. Leave blank to render at the display size.
# Recommended: 2560x1440, or 3840x2160 on a strong GPU.
RenderWidth=
RenderHeight=

# SMAA is a cheap form of anti-aliasing. Defaults to on, and keep it on, even
# if you're using supersampling.
SMAA=true

# A more expensive form of anti-aliasing. Not recommended if you already chose
# supersampling. Accepts 1 (off), 2, 4 or 8.
MSAA=1

# By default, the low-res font is replaced in all three Arland games.
# You can set this to `original` if you prefer the original, low quality font,
# or `upscaled` to keep the original look but smooth it.
Font=replaced

# Sharpens the shadows. Accepts 1 (off), 2, 4 or 8. Higher costs video memory.
ShadowMultiplier=1

# Keeps surfaces at a shallow angle (floors, walls, distant ground) sharp
# instead of blurry. Accepts 1 (off), 2, 4, 8 or 16. Costs nothing per frame,
# so it defaults to the maximum and the launcher no longer offers a control for
# it -- there is no trade to present. Saving from the launcher rewrites this to
# 16; edit it here if you want less.
AnisotropicFiltering=16

[Battle]
# Enable battle shadows in combat; only applies to Rorona DX, which lacks them.
BattleShadows=true

# Restore the ground shadows during battle cut-ins. Applies to all three games.
BattleCutInShadows=true

# During a cut-in the scene is slightly dimmed. Off by default, so the close-up
# is held at full brightness; set this to true for the original dimming.
BattleCutInDimming=false

[Launcher]
# Pressing Play in Steam normally opens arland-fix-launcher.exe. Set this to
# true to go straight into the game instead, using the settings already in this
# file. Nothing else changes: the game still starts the same way, so the Steam
# overlay, playtime and Steam Input keep working. Run arland-fix-launcher.exe
# yourself when you want to change a setting or turn this back off.
SkipLauncher=false

[Diagnostics]
# Extra logging in arland-fix.log. Crash reports are always written.
VerboseLogging=false
