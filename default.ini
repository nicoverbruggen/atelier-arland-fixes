#########################################
## Settings for Atelier Arland Fix
##
## Place beside the game executable, next to d3d11.dll. Every value here is the
## default, so deleting the file (or any single line) changes nothing.
##
## Most of this is easier to set in arland-fix-launcher.exe. Edit here for the
## few options the launcher does not show, or to see what the defaults are.
##
## Full documentation: ADVANCED.md
#########################################

[Rendering]
DisplayWidth=
DisplayHeight=
Borderless=true
RenderWidth=
RenderHeight=
SMAA=true
Sharpen=0
Font=replaced
ShadowMultiplier=2
AnisotropicFiltering=16

[Battle]
BattleCutInShadows=false
BattleCutInDimming=true

[Startup]
SkipLogos=false
SkipIntroMovie=false

[Field]
MonsterSnapFix=true
CharacterPullFix=true

[Menus]
FastSaveMenu=true

[Launcher]
SkipLauncher=false

[Diagnostics]
VerboseLogging=false
