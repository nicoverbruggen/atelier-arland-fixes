name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Built with MSVC (rather than the local MinGW cross-build) because MSVC output
# is far less likely to trip Microsoft Defender's ML heuristics (Wacatac!ml and
# similar) than MinGW output, which is over-represented in malware corpora. One
# job per target architecture: switching MSVC arch inside a single job is
# unreliable, so x64 (d3d11.dll) and x86 (msimg32.dll) build separately.
jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: meson setup build64 --buildtype release
      - run: meson compile -C build64
      - uses: actions/upload-artifact@v4
        with:
          name: d3d11
          path: build64/d3d11.dll

  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - run: meson setup build32 --buildtype release
      - run: meson compile -C build32
      - uses: actions/upload-artifact@v4
        with:
          name: msimg32
          path: build32/msimg32.dll

  release:
    needs: [build-x64, build-x86]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: d3d11
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: msimg32
          path: dist
      - name: Assemble the release archive
        run: |
          # Shipped under its final name so the archive extracts straight into
          # the game directory with nothing to rename.
          cp default.ini dist/arland-fix.ini
          # Documentation and licences go in a subfolder so the three files that
          # actually have to sit beside the executable stay at the top level. The
          # fonts are embedded in d3d11.dll, so their copyright notices and
          # licence texts have to travel with the binary, not just live in the repo.
          mkdir -p dist/atelier-fix
          cp README.md CHANGELOG.md ADVANCED.md dist/atelier-fix/
          cp -r licenses dist/atelier-fix/LICENSES
          cd dist
          zip -r "../atelier-arland-fixes-${GITHUB_REF_NAME}.zip" \
            d3d11.dll msimg32.dll arland-fix.ini atelier-fix
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## ${GITHUB_REF_NAME}" '
            $0 == heading { found = 1; next }
            found && /^## v/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > changes.md
          # Install instructions first, then this version's changelog section.
          cat > release-notes.md <<'NOTES'
          ## Installing

          Download the `.zip` below and extract all three files into the game's
          installation folder — the one containing the game executable
          (`A11R_x64_Release_en.exe` for Rorona, `A12V_x64_Release_en.exe` for
          Totori, `A13V_x64_Release_EN.exe` for Meruru):

          - `d3d11.dll` — the mod itself
          - `msimg32.dll` — adds 1440p and 4K to the game's settings launcher
          - `arland-fix.ini` — optional settings, documented inline

          The archive also contains an `atelier-fix` folder with the
          documentation and the licences for the embedded fonts. Nothing reads
          it at runtime, so keep it or delete it as you prefer.

          Everything works with no configuration; the `.ini` only needs editing if
          you want the optional extras. To uninstall, delete the three files.

          **Upgrading from an earlier version**: replace the two DLLs, but keep the
          `arland-fix.ini` you already have. The bundled one contains nothing but
          the defaults, so overwriting it would silently discard your settings.

          **Steam Deck, Linux and anyone using Proton**: also add this to the
          game's Steam Launch Options:

          ```
          WINEDLLOVERRIDES="d3d11,msimg32=n,b" %command%
          ```

          ## Changes

          NOTES
          cat changes.md >> release-notes.md
          # Tags containing "pre" (e.g. v0.5-pre) publish as a GitHub pre-release.
          if echo "${GITHUB_REF_NAME}" | grep -qi 'pre'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE="--latest"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md $PRERELEASE
            gh release upload "${GITHUB_REF_NAME}" "atelier-arland-fixes-${GITHUB_REF_NAME}.zip" dist/d3d11.dll dist/msimg32.dll --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "atelier-arland-fixes-${GITHUB_REF_NAME}.zip" dist/d3d11.dll dist/msimg32.dll --verify-tag --notes-file release-notes.md --title "${GITHUB_REF_NAME}" $PRERELEASE
          fi
