name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Built with MSVC (rather than the local MinGW cross-build) because MSVC output
# is far less likely to trip Microsoft Defender's ML heuristics (Wacatac!ml and
# similar) than MinGW output, which is over-represented in malware corpora. One
# job per target architecture: switching MSVC arch inside a single job is
# unreliable, so x64 (d3d11.dll) and x86 (msimg32.dll) build separately.
jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      # b_vscrt=static_from_buildtype links the CRT statically for a release
      # build. Without it MSVC links it dynamically and the binaries need the
      # Visual C++ redistributable installed on the player's machine -- which
      # most will not have, and Windows then refuses to start the process with
      # no useful message. A mod is dropped into a game folder, not installed,
      # so it cannot ask for a runtime first.
      - run: meson setup build64 --buildtype release -Db_vscrt=static_from_buildtype
      # The launcher's manifest is embedded verbatim by the resource compiler,
      # which does not parse it, and neither rc.exe nor windres complains about
      # malformed XML. Windows does: it refuses to start the process with "the
      # side-by-side configuration is incorrect" and puts the real reason only
      # in the event log. So the well-formedness check has to happen here.
      # Watch for "--" in a comment, which XML forbids and which the repo's
      # prose style otherwise uses freely as an em dash.
      - name: Check the launcher manifest is well-formed XML
        run: python -c "import xml.dom.minidom; xml.dom.minidom.parse('src/config_gui/arland-fix-launcher.manifest')"
      - run: meson compile -C build64
      - uses: actions/upload-artifact@v7
        with:
          name: d3d11
          path: |
            build64/d3d11.dll
            build64/arland-fix-launcher.exe

  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86
      - run: meson setup build32 --buildtype release -Db_vscrt=static_from_buildtype
      - run: meson compile -C build32
      - uses: actions/upload-artifact@v7
        with:
          name: msimg32
          path: build32/msimg32.dll

  # Assembles the archive on EVERY build, not only on a tag. The per-target
  # artifacts above are loose binaries: usable, but they leave whoever is testing
  # to work out which files go where and to remember the .ini. This is the thing
  # people are actually given, so it is also the thing worth testing -- and a
  # release should be the same archive that has already been exercised, not one
  # first assembled at tag time.
  package:
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: d3d11
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: msimg32
          path: dist
      # default.ini ships to users and repeats defaults that live in src/, so
      # check it before packaging rather than spending a separate runner on it.
      - name: Check shipped configuration defaults
        run: python3 scripts/check_default_ini.py
      - name: Assemble the archive
        run: |
          # Shipped under its final name so the archive extracts straight into
          # the game directory with nothing to rename.
          cp default.ini dist/arland-fix.ini
          # Documentation and the required licences go in a subfolder so the four
          # files that actually have to sit beside the executable stay at the top
          # level. The vendored texts are named for what they cover, since
          # LICENSE points at them and there is no vendor/ tree here.
          mkdir -p dist/arland-fix
          cp README.md CHANGELOG.md ADVANCED.md LICENSE dist/arland-fix/
          cp -r licenses dist/arland-fix/LICENSES
          cp vendor/minhook/LICENSE.txt dist/arland-fix/LICENSES/MinHook.txt
          cp vendor/smaa/LICENSE.txt dist/arland-fix/LICENSES/SMAA.txt
          cd dist
          zip -r ../arland-fix.zip \
            d3d11.dll msimg32.dll arland-fix.ini arland-fix-launcher.exe arland-fix
      - uses: actions/upload-artifact@v7
        with:
          name: arland-fix
          path: arland-fix.zip

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: arland-fix
      - name: Name the archive for this tag
        run: mv arland-fix.zip "arland-fix-${GITHUB_REF_NAME}.zip"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are the CHANGELOG section for the tag. A pre-release
          # tag (v0.5-pre, v0.5-pre2) rarely has a heading of its own, so it
          # falls back to the release it leads up to: v0.5-pre2 -> ## v0.5.
          # That way cutting a pre-release needs no CHANGELOG edit.
          extract_notes() {
            awk -v heading="## $1" '
              $0 == heading { found = 1; next }
              found && /^## v/ { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md
          }
          BASE_TAG="$(echo "${GITHUB_REF_NAME}" | sed -E 's/-?pre[0-9]*$//I')"
          if extract_notes "${GITHUB_REF_NAME}" > changes.md; then
            echo "Release notes from ## ${GITHUB_REF_NAME}"
          elif [ "${BASE_TAG}" != "${GITHUB_REF_NAME}" ] && \
               extract_notes "${BASE_TAG}" > changes.md; then
            echo "No ## ${GITHUB_REF_NAME} heading; using ## ${BASE_TAG}"
          elif [ "${BASE_TAG}" != "${GITHUB_REF_NAME}" ]; then
            echo "CHANGELOG.md has neither a ## ${GITHUB_REF_NAME} nor a ## ${BASE_TAG} heading" >&2
            exit 1
          else
            echo "CHANGELOG.md has no ## ${GITHUB_REF_NAME} heading" >&2
            exit 1
          fi
          # Tags containing "pre" (e.g. v0.5-pre) publish as a GitHub pre-release.
          if echo "${GITHUB_REF_NAME}" | grep -qi 'pre'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE="--latest"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file changes.md $PRERELEASE
            gh release upload "${GITHUB_REF_NAME}" "arland-fix-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "arland-fix-${GITHUB_REF_NAME}.zip" --verify-tag --notes-file changes.md --title "${GITHUB_REF_NAME}" $PRERELEASE
          fi
